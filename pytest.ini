[pytest]
asyncio_mode = auto
# This machine has ROS2 Humble on PYTHONPATH (leaks into the venv, venv
# isolation doesn't strip PYTHONPATH). Its launch_testing/launch_ros pytest
# plugins are broken here (missing the `lark` dependency) and would otherwise
# crash every pytest invocation via setuptools entry-point autoloading.
addopts = -p no:launch_testing -p no:launch_ros
